<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Auftragszentrale — Demo | M&amp;H Assistenz</title>
<meta name="description" content="Durchklickbare Demo: Auftrag erfassen, vor Ort mit Fotos und Sprache dokumentieren, daraus einen Rechnungsentwurf vorbereiten. Beispieldaten, keine echten Aufträge.">

<meta property="og:title" content="Auftragszentrale — Demo | M&amp;H Assistenz">
<meta property="og:description" content="Durchklickbare Demo: Auftrag erfassen, vor Ort dokumentieren, Rechnungsentwurf vorbereiten. Beispieldaten.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mhassistenz.de/demo/auftragszentrale/">
<meta property="og:image" content="https://mhassistenz.de/demo/auftragszentrale/bilder/vorschau.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Auftragszentrale — Demo von M&amp;H Assistenz">
<meta property="og:locale" content="de_DE">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mhassistenz.de/demo/auftragszentrale/bilder/vorschau.png">
<link rel="canonical" href="https://mhassistenz.de/demo/auftragszentrale/">
<link rel="icon" href="/favicon.png">

<!-- Schrift liegt lokal unter fonts/ (Inter, SIL OFL). Bewusst kein
     Google-CDN: das würde bei jedem Aufruf die IP des Betrachters an einen
     Dritten übertragen. Einbindung per @font-face in styles.css. -->
<link rel="preload" href="fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ── Seitennavigation (Desktop) ─────────── -->
  <aside class="sidebar">
    <div class="sb-top">
      <div class="sb-firma">PT Hausmeisterservice</div>
      <div class="sb-sub">Auftragszentrale</div>
    </div>

    <nav class="sb-nav" id="navDesktop" aria-label="Hauptnavigation"></nav>

    <div class="sb-foot">
      <div class="sb-demo">
        <span class="hinweis-marke">Demo</span>
        Fiktive Daten. Foto-Auswertung, Spracherkennung und Rechnungsversand sind simuliert.
      </div>
      <button class="btn btn-sm btn-block" id="btnReset" type="button">Demo zurücksetzen</button>
    </div>
  </aside>

  <!-- ── Hauptbereich ───────────────────────── -->
  <div class="main">
    <header class="topbar">
      <div class="mobile-brand">
        <span class="mb-firma">PT Hausmeisterservice</span>
      </div>
      <div class="crumbs"><strong id="crumbSeite">Home</strong></div>
      <div class="tb-spacer"></div>
      <div class="tb-clock" id="clock"></div>
    </header>

    <!-- Wird nur sichtbar, wenn der Browser nicht dauerhaft speichern kann -->
    <div id="speicherHinweis" hidden></div>

    <main id="pages">
      <section class="page" id="page-home"       aria-labelledby="t-home"></section>
      <section class="page" id="page-auftraege"  aria-labelledby="t-auftraege"></section>
      <section class="page" id="page-kalender"   aria-labelledby="t-kalender"></section>
      <section class="page" id="page-rechnungen" aria-labelledby="t-rechnungen"></section>
    </main>
  </div>
</div>

<!-- ── Tab-Leiste (Handy) ───────────────────── -->
<nav class="mobile-tabbar" id="navMobile" aria-label="Hauptnavigation (mobil)"></nav>

<!-- Overlays: Auftragsakte, Erfassung, Rechnungsentwurf -->
<div id="overlay"></div>

<script type="module" src="app.js"></script>
</body>
</html>
